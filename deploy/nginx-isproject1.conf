# Main site and www
server {
    listen 80 default_server;
    server_name isproject.test www.isproject.test;
    root /var/www/isproject1;
    index login.php index.html;
    location / { try_files $uri $uri/ =404; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php7.4-fpm.sock;
    }
    location ~ /\.(git|env) { deny all; }
}
# app subdomain: the web application
server {
    listen 80;
    server_name app.isproject.test;
    root /var/www/isproject1;
    index login.php index.html;
    location / { try_files $uri $uri/ =404; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php7.4-fpm.sock;
    }
}
# admin subdomain
server {
    listen 80;
    server_name admin.isproject.test;
    root /var/www/isproject1/admin;
    index index.php;
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php7.4-fpm.sock;
    }
}
# status subdomain
server {
    listen 80;
    server_name status.isproject.test;
    root /var/www/isproject1/status;
    index index.html;
}

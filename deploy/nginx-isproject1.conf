# Main site and www — HTTP, redirect to HTTPS
server {
    listen 80 default_server;
    server_name rogueapdetec.me www.rogueapdetec.me;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2 default_server;
    server_name rogueapdetec.me www.rogueapdetec.me;
    ssl_certificate     /etc/letsencrypt/live/rogueapdetec.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rogueapdetec.me/privkey.pem;
    root /var/www/isproject1;
    index login.php index.html;
    location / { try_files $uri $uri/ =404; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php7.4-fpm.sock;
    }
    location ~ /\.(git|env) { deny all; }
}

